# Dashboard "Bojler" — generated at runtime by the dashboard strategy "custom:bojler"
# (custom_components/ariston_schedule/frontend/bojler-dashboard.js) in the language of each user's
# Home Assistant profile: English, Deutsch, Français, Italiano, Español, Русский, Srpski (latinica / ћирилица).
# Texts: i18n/<lang>.yaml → python tools/i18n_build.py.
#
# Four tabs (paths stay the same in every language; notifications open /bojler-dash/bojler):
#   bojler       status + manual heating + cost summary
#   potrosnja    consumption: kWh and cost per tariff for any period, monthly charts, Excel export
#   raspored     view and edit the schedule stored in the boiler
#   podesavanja  electricity prices, notification language, advanced, safety settings (read-only)
#
# To force one language for everybody add e.g.  language: de
strategy:
  type: custom:bojler
