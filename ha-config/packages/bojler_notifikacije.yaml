# Boiler notifications. Texts come from custom_templates/bojler_i18n.jinja (generated from i18n/*.yaml)
# in the language chosen in input_select.bojler_jezik (dashboard → Settings).
# Target phone: the notify action in secrets.yaml (bojler_notify: notify.mobile_app_<your_phone>).
# clickAction: tapping a notification opens the Bojler dashboard.
# No automation ever touches anti-legionella or the maximum temperature.

automation:
  - id: bojler_jutarnji_izvestaj
    alias: Bojler – morning report (night heating)
    description: At 08:00 report the water temperature and how much was used in the cheap tariff.
    mode: single
    triggers:
      - trigger: time
        at: "08:00:00"
    actions:
      - action: !secret bojler_notify
        data:
          title: "{% from 'bojler_i18n.jinja' import t %}{{ t('morning_title') }}"
          message: >
            {% from 'bojler_i18n.jinja' import t %}{{ t('morning_msg', {
              'temp': states('sensor.bojler_temperatura_vode'),
              'showers': states('sensor.bojler_dostupni_tusevi'),
              'cheap': states('sensor.bojler_raspored_potrosnja_u_jeftinoj_tarifi_24h') | float(0) | round(2),
              'share': states('sensor.bojler_raspored_udeo_jeftine_tarife_24h')}) }}
          data:
            tag: bojler_jutro
            group: bojler
            channel: Bojler
            clickAction: /bojler-dash/bojler

  - id: bojler_voda_spremna
    alias: Bojler – water ready (daytime heating finished)
    description: After heating during the day (07–23h) report that the water is ready.
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.bojler_greje
        from: "on"
        to: "off"
        for: "00:02:00"
    conditions:
      - condition: time
        after: "07:00:00"
        before: "23:00:00"
      # no duplicate when manual heating ends (bojler_rucno_grejanje_kraj reports that)
      - condition: state
        entity_id: switch.bojler_rucno_grejanje
        state: "off"
      - condition: template
        value_template: "{{ (now() - states.switch.bojler_rucno_grejanje.last_changed).total_seconds() > 300 }}"
    actions:
      - action: !secret bojler_notify
        data:
          title: "{% from 'bojler_i18n.jinja' import t %}{{ t('ready_title') }}"
          message: >
            {% from 'bojler_i18n.jinja' import t %}{{ t('ready_msg', {
              'temp': states('sensor.bojler_temperatura_vode'),
              'showers': states('sensor.bojler_dostupni_tusevi')}) }}
          data:
            tag: bojler_status
            group: bojler
            channel: Bojler
            clickAction: /bojler-dash/bojler

  - id: bojler_greje_skupa_tarifa
    alias: Bojler – heating in the expensive tariff
    description: >
      Warn if the boiler heats outside the cheap tariff (06–24h) for 10 min and it is not manual heating
      (MANUAL/BOOST). At most once every 3 h.
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.bojler_greje
        to: "on"
        for: "00:10:00"
    conditions:
      - condition: time
        after: "06:00:00"
      - condition: state
        entity_id: switch.bojler_rucno_grejanje
        state: "off"
    actions:
      - action: !secret bojler_notify
        data:
          title: "{% from 'bojler_i18n.jinja' import t %}{{ t('expensive_title') }}"
          message: >
            {% from 'bojler_i18n.jinja' import t %}{{ t('expensive_msg', {
              'since': as_local(states.binary_sensor.bojler_greje.last_changed).strftime('%H:%M'),
              'temp': states('sensor.bojler_temperatura_vode'),
              'mode': t('mode_' ~ states('water_heater.bojler'))}) }}
          data:
            tag: bojler_skupo
            group: bojler
            channel: Bojler
            clickAction: /bojler-dash/bojler
      - delay: "03:00:00"

  - id: bojler_malo_tople_vode
    alias: Bojler – little hot water in the evening
    description: If the water is below 40 °C between 16 and 22h, offer BOOST with a button. At most once every 12 h.
    mode: single
    triggers:
      - trigger: numeric_state
        entity_id: sensor.bojler_temperatura_vode
        below: 40
        for: "00:10:00"
    conditions:
      - condition: time
        after: "16:00:00"
        before: "22:00:00"
      - condition: template
        value_template: >
          {{ this.attributes.last_triggered is none or
             (now() - this.attributes.last_triggered).total_seconds() > 12 * 3600 }}
    actions:
      - action: !secret bojler_notify
        data:
          title: "{% from 'bojler_i18n.jinja' import t %}{{ t('low_title') }}"
          message: "{% from 'bojler_i18n.jinja' import t %}{{ t('low_msg', {'temp': states('sensor.bojler_temperatura_vode')}) }}"
          data:
            tag: bojler_boost_ponuda
            group: bojler
            channel: Bojler
            clickAction: /bojler-dash/bojler
            actions:
              - action: BOJLER_BOOST
                title: "{% from 'bojler_i18n.jinja' import t %}{{ t('boost_button') }}"

  - id: bojler_boost_iz_notifikacije
    alias: Bojler – BOOST from a notification
    mode: single
    triggers:
      - trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: BOJLER_BOOST
    actions:
      - action: script.bojler_boost
      - action: !secret bojler_notify
        data:
          message: "{% from 'bojler_i18n.jinja' import t %}{{ t('boost_on') }}"
          data:
            tag: bojler_boost_ponuda
            group: bojler
            channel: Bojler
            clickAction: /bojler-dash/bojler

  - id: bojler_boost_podsetnik
    alias: Bojler – BOOST running for a long time
    mode: single
    triggers:
      - trigger: state
        entity_id: water_heater.bojler
        to: BOOST
        for: "02:00:00"
    actions:
      - action: !secret bojler_notify
        data:
          title: "{% from 'bojler_i18n.jinja' import t %}{{ t('boost_long_title') }}"
          message: "{% from 'bojler_i18n.jinja' import t %}{{ t('boost_long_msg') }}"
          data:
            tag: bojler_boost
            group: bojler
            channel: Bojler
            clickAction: /bojler-dash/bojler

  - id: bojler_nedostupan
    alias: Bojler – unavailable / available again
    description: Report when Ariston data has been unavailable for 30 min, and when it returns after such an outage.
    mode: queued
    triggers:
      - trigger: state
        entity_id:
          - water_heater.bojler
          - sensor.bojler_raspored_raspored
        to: unavailable
        for: "00:30:00"
        id: nestao
      - trigger: state
        entity_id:
          - water_heater.bojler
          - sensor.bojler_raspored_raspored
        from: unavailable
        id: vratio
    conditions:
      - condition: or
        conditions:
          - condition: trigger
            id: nestao
          - condition: template
            value_template: "{{ (now() - trigger.from_state.last_changed).total_seconds() > 1800 }}"
    actions:
      - action: !secret bojler_notify
        data:
          title: "{% from 'bojler_i18n.jinja' import t %}{{ t('conn_title') }}"
          message: >
            {% from 'bojler_i18n.jinja' import t %}
            {% if trigger.id == 'nestao' %}{{ t('conn_lost', {'name': trigger.to_state.name}) }}
            {% else %}{{ t('conn_back') }}{% endif %}
          data:
            tag: bojler_veza
            group: bojler
            channel: Bojler
            clickAction: /bojler-dash/bojler

  - id: bojler_rucno_grejanje_kraj
    alias: Bojler – manual heating finished → back to the schedule
    description: >
      After manual heating (MANUAL/BOOST) put the boiler back on PROGRAM so it does not keep the temperature
      all day at the expensive tariff: as soon as the water reaches the target (the boiler itself does not
      stop then — it heats the whole tank), if the water is already hotter than the target when switched on,
      when the boiler stops heating by itself, or after 4 h at the latest.
    mode: single
    triggers:
      - trigger: template
        value_template: >
          {{ states('sensor.bojler_temperatura_vode') | float(0) >= states('input_number.bojler_rucno_temp') | float(99) }}
        for: "00:02:00"
        id: dostignuto
      - trigger: state
        entity_id: switch.bojler_rucno_grejanje
        to: "on"
        for: "00:03:00"
        id: provera
      - trigger: state
        entity_id: binary_sensor.bojler_greje
        from: "on"
        to: "off"
        for: "00:01:00"
        id: zagrejano
      - trigger: state
        entity_id: switch.bojler_rucno_grejanje
        to: "on"
        for: "04:00:00"
        id: isteklo
    conditions:
      - condition: state
        entity_id: switch.bojler_rucno_grejanje
        state: "on"
      - condition: or
        conditions:
          - condition: trigger
            id: [dostignuto, zagrejano, isteklo]
          # "provera" (check): switched on, but the water is already at/above the target
          - condition: and
            conditions:
              - condition: trigger
                id: provera
              - condition: template
                value_template: >
                  {{ states('sensor.bojler_temperatura_vode') | float(0) >= states('input_number.bojler_rucno_temp') | float(99) }}
    actions:
      - action: script.bojler_program
      - action: !secret bojler_notify
        data:
          title: "{% from 'bojler_i18n.jinja' import t %}{{ t('manual_title') }}"
          message: >
            {% from 'bojler_i18n.jinja' import t %}
            {% set p = {'temp': states('sensor.bojler_temperatura_vode'),
                        'target': states('input_number.bojler_rucno_temp') | int} %}
            {% if trigger.id in ['dostignuto', 'zagrejano'] %}{{ t('manual_reached', p) }}
            {% elif trigger.id == 'provera' %}{{ t('manual_already', p) }}
            {% else %}{{ t('manual_timeout', p) }}{% endif %} {{ t('manual_back') }}
          data:
            tag: bojler_rucno
            group: bojler
            channel: Bojler
            clickAction: /bojler-dash/bojler

  - id: bojler_antilegionela_iskljucena
    alias: Bojler – anti-legionella switched off
    description: Warn if anti-legionella is switched off by any means (dashboard, official app, boiler panel).
    mode: single
    triggers:
      - trigger: state
        entity_id: switch.bojler_antilegionela
        from: "on"
        to: "off"
    actions:
      - action: !secret bojler_notify
        data:
          title: "{% from 'bojler_i18n.jinja' import t %}{{ t('antileg_title') }}"
          message: "{% from 'bojler_i18n.jinja' import t %}{{ t('antileg_msg') }}"
          data:
            tag: bojler_antilegionela
            group: bojler
            channel: Bojler
            clickAction: /bojler-dash/bojler
            importance: high

  - id: bojler_greska
    alias: Bojler – device error
    mode: single
    triggers:
      - trigger: numeric_state
        entity_id: sensor.bojler_greske
        above: 0
    actions:
      - action: !secret bojler_notify
        data:
          title: "{% from 'bojler_i18n.jinja' import t %}{{ t('error_title') }}"
          message: "{% from 'bojler_i18n.jinja' import t %}{{ t('error_msg', {'count': states('sensor.bojler_greske')}) }}"
          data:
            tag: bojler_greska
            group: bojler
            channel: Bojler
            clickAction: /bojler-dash/bojler
            importance: high
