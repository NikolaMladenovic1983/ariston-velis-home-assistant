language_name: Русский

integration:
  config:
    step:
      user:
        title: Учётная запись Ariston
        description: Те же адрес электронной почты и пароль, что и в официальном приложении Ariston NET.
        data:
          username: Электронная почта
          password: Пароль
      device:
        title: Выбор водонагревателя
        data:
          gateway_id: Водонагреватель
    error:
      invalid_auth: Неверный адрес электронной почты или пароль
      cannot_connect: Не удаётся подключиться к серверу Ariston
      no_devices: В этой учётной записи нет водонагревателя Velis
    abort:
      already_configured: Этот водонагреватель уже настроен
  options:
    step:
      init:
        title: Ночной тариф
        description: Часы дешёвого (ночного) тарифа на электроэнергию, используются датчиками потребления и стоимости.
        data:
          cheap_start_hour: Начало (час)
          cheap_end_hour: Конец (час)
  device:
    boiler_schedule:
      name: Расписание водонагревателя
  entity:
    sensor:
      schedule: {name: Расписание}
      next_slot: {name: Следующий интервал}
      energy_24h: {name: Потребление за 24 ч}
      energy_cheap_24h: {name: Потребление по ночному тарифу за 24 ч}
      cheap_share_24h: {name: Доля ночного тарифа за 24 ч}
      energy_7d: {name: Потребление за 7 дней}
      energy_total: {name: Общее потребление}
      energy_cheap: {name: Общее потребление по ночному тарифу}
      energy_expensive: {name: Общее потребление по дневному тарифу}
      cost_cheap: {name: Стоимость по ночному тарифу}
      cost_expensive: {name: Стоимость по дневному тарифу}
      cost_total: {name: Общая стоимость}
      export_xlsx: {name: Отчёт Excel}
  exceptions:
    not_loaded: {message: Интеграция «Расписание Ariston» не загружена}
    invalid_time: {message: "Неверное время: {value} (ожидается HH:MM)"}
    invalid_day: {message: "Неверный день: {value}"}
    no_days: {message: Не указан ни один день}
    temp_and_showers: {message: "{time}: укажите либо температуру, либо количество душей, но не оба значения"}
    temp_range: {message: "{time}: температура {temp} °C вне диапазона {min}–{max} °C"}
    showers_range: {message: "{time}: количество душей должно быть 1–{max}"}
    duplicate_time: {message: "{day}: два интервала в одно и то же время"}
    too_many_slots: {message: "{day}: не более {max} интервалов в день"}
    empty_schedule: {message: Расписание не может быть полностью пустым}
    read_failed: {message: "Не удаётся прочитать текущее расписание: {error}"}
    write_failed: {message: "Не удалось записать расписание: {error} (резервная копия: {backup})"}
    verify_failed: {message: "Ariston принял запись, но прочитанное расписание отличается. Резервная копия: {backup}"}
    no_backups: {message: Нет сохранённых резервных копий}
    backup_missing: {message: "Резервная копия {name} не существует. Доступны: {available}"}
  services:
    set_days:
      name: Задать расписание для дней
      description: Заменяет интервалы выбранных дней (остальные дни не меняются). Перед записью создаётся резервная копия, после записи результат проверяется.
      fields:
        days:
          name: Дни
          description: "all, workdays, weekend, mon…sun или 0–6 (0 = воскресенье)"
        slots:
          name: Интервалы
          description: 'Список интервалов: [{"time": "06:00", "temp": 75}] или [{"time": "07:00", "showers": 2}]. Время = когда вода должна быть готова.'
    set_schedule:
      name: Задать всё расписание
      description: Заменяет всё недельное расписание. Дни, которые не указаны, остаются без интервалов.
      fields:
        plans:
          name: Планы
          description: '[{"days": "workdays", "slots": [...]}, {"days": "weekend", "slots": [...]}]'
    restore_backup:
      name: Восстановить расписание из резервной копии
      description: Без имени файла восстанавливает расписание, каким оно было до последнего изменения.
      fields:
        file:
          name: Файл
          description: Имя файла резервной копии в /config/ariston_schedule_backups
    refresh:
      name: Обновить
      description: Сейчас прочитать расписание и потребление с сервера Ariston.
    export_xlsx:
      name: Создать отчёт Excel
      description: Создаёт файл .xlsx с потреблением (кВт·ч) и стоимостью по тарифам по месяцам, дням и часам. Ссылка находится в датчике «Отчёт Excel».

