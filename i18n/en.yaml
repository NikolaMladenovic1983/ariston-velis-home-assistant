# English — reference catalog. Every other language must have exactly the same keys
# (checked by tests/test_i18n.py). Placeholders in {braces} must be kept as they are.
# After editing run:  python tools/i18n_build.py
language_name: English

# Home Assistant translations of the ariston_schedule integration (translations/<lang>.json)
integration:
  config:
    step:
      user:
        title: Ariston account
        description: The same email and password as in the official Ariston NET app.
        data:
          username: Email
          password: Password
      device:
        title: Select the water heater
        data:
          gateway_id: Water heater
    error:
      invalid_auth: Invalid email or password
      cannot_connect: Cannot connect to the Ariston server
      no_devices: There is no Velis water heater on this account
    abort:
      already_configured: This water heater is already configured
  options:
    step:
      init:
        title: Cheap tariff
        description: Hours of the cheap (lower) electricity tariff, used for the consumption and cost sensors.
        data:
          cheap_start_hour: Start (hour)
          cheap_end_hour: End (hour)
  device:
    boiler_schedule:
      name: Boiler schedule
  entity:
    sensor:
      schedule: {name: Schedule}
      next_slot: {name: Next slot}
      energy_24h: {name: Consumption last 24h}
      energy_cheap_24h: {name: Cheap-tariff consumption 24h}
      cheap_share_24h: {name: Cheap-tariff share 24h}
      energy_7d: {name: Consumption last 7 days}
      energy_total: {name: Total consumption}
      energy_cheap: {name: Total consumption cheap tariff}
      energy_expensive: {name: Total consumption expensive tariff}
      cost_cheap: {name: Cost cheap tariff}
      cost_expensive: {name: Cost expensive tariff}
      cost_total: {name: Total cost}
      export_xlsx: {name: Excel report}
  exceptions:
    not_loaded: {message: The Ariston schedule integration is not loaded}
    invalid_time: {message: "Invalid time: {value} (expected HH:MM)"}
    invalid_day: {message: "Invalid day: {value}"}
    no_days: {message: No day was given}
    temp_and_showers: {message: "{time}: set either a temperature or a number of showers, not both"}
    temp_range: {message: "{time}: temperature {temp} °C is outside {min}–{max} °C"}
    showers_range: {message: "{time}: the number of showers must be 1–{max}"}
    duplicate_time: {message: "{day}: two slots at the same time"}
    too_many_slots: {message: "{day}: at most {max} slots per day"}
    empty_schedule: {message: The schedule cannot be completely empty}
    read_failed: {message: "Cannot read the current schedule: {error}"}
    write_failed: {message: "Writing the schedule failed: {error} (backup: {backup})"}
    verify_failed: {message: "Ariston accepted the write, but the schedule read back is different. Backup: {backup}"}
    no_backups: {message: There are no saved backups}
    backup_missing: {message: "Backup {name} does not exist. Available: {available}"}
  services:
    set_days:
      name: Set schedule for days
      description: Replaces the slots of the selected days (other days stay the same). A backup is made before writing and the result is verified.
      fields:
        days:
          name: Days
          description: "all, workdays, weekend, mon…sun or 0–6 (0 = Sunday)"
        slots:
          name: Slots
          description: 'List of slots: [{"time": "06:00", "temp": 75}] or [{"time": "07:00", "showers": 2}]. Time = when the water should be ready.'
    set_schedule:
      name: Set the whole schedule
      description: Replaces the whole weekly schedule. Days that are not listed get no slots.
      fields:
        plans:
          name: Plans
          description: '[{"days": "workdays", "slots": [...]}, {"days": "weekend", "slots": [...]}]'
    restore_backup:
      name: Restore schedule from backup
      description: Without a file name it restores the schedule as it was before the last change.
      fields:
        file:
          name: File
          description: Backup file name from /config/ariston_schedule_backups
    refresh:
      name: Refresh
      description: Read the schedule and the consumption from the Ariston server now.
    export_xlsx:
      name: Create Excel report
      description: Creates an .xlsx file with consumption (kWh) and cost per tariff by month, day and hour. The link is in the "Excel report" sensor.

days: {mon: Monday, tue: Tuesday, wed: Wednesday, thu: Thursday, fri: Friday, sat: Saturday, sun: Sunday}

