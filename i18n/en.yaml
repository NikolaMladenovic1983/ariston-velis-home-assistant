# Notifications and script messages (language chosen in Settings → notification language)
notify:
  mode_PROGRAM: schedule
  mode_MANUAL: manual
  mode_BOOST: BOOST
  morning_title: Boiler – morning
  morning_msg: "Water {temp} °C, {showers} shower(s). Used in the cheap tariff overnight: {cheap} kWh (24h share: {share} %)."
  ready_title: Boiler – water ready
  ready_msg: "Heating finished: {temp} °C, {showers} shower(s)."
  expensive_title: The boiler is heating in the expensive tariff
  expensive_msg: "Heating since {since} (water {temp} °C, mode: {mode})."
  low_title: Boiler – little hot water
  low_msg: "The water is {temp} °C. Turn on BOOST (expensive tariff)?"
  boost_button: BOOST
  boost_on: BOOST is on.
  boost_long_title: Boiler – BOOST
  boost_long_msg: BOOST has been on for 2 hours. Switch back to the schedule from the dashboard?
  conn_title: Boiler – connection
  conn_lost: "No data from the Ariston server for 30 min ({name}). The boiler keeps running on its built-in schedule."
  conn_back: Data from the Ariston server is arriving again.
  manual_title: Boiler – manual heating finished
  manual_reached: "Water heated to {temp} °C (target {target} °C)."
  manual_already: "The water is already {temp} °C, so heating to {target} °C is not needed."
  manual_timeout: "Manual heating ran for 4 h and was stopped (water {temp} °C)."
  manual_back: The boiler is back on the schedule.
  antileg_title: Boiler – anti-legionella OFF
  antileg_msg: Legionella protection has just been switched off. If this was not intended, switch it on in the official Ariston app.
  error_title: Boiler – ERROR
  error_msg: "The boiler reports an error (error count: {count}). Check the boiler display or the official app."
  sched_title: Boiler – schedule
  sched_written: "Schedule written and verified. Weekdays: {weekdays}. Weekend: {weekend}. (backup: {backup})"
  sched_unchanged: The schedule is already like this, so nothing was changed.
  sched_restored: "Schedule restored from {file}."

