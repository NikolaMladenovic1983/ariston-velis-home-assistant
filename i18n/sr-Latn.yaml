    backup_missing: {message: "Rezervna kopija {name} ne postoji. Dostupne: {available}"}
  services:
    set_days:
      name: Postavi raspored za dane
      description: Zamenjuje termine za izabrane dane (ostali dani ostaju isti). Pre upisa se pravi rezervna kopija, a posle upisa se proverava rezultat.
      fields:
        days:
          name: Dani
          description: "svi, radni, vikend, pon…ned ili 0–6 (0 = nedelja)"
        slots:
          name: Termini
          description: 'Lista termina: [{"time": "06:00", "temp": 75}] ili [{"time": "07:00", "showers": 2}]. Vreme = kada voda treba da bude spremna.'
    set_schedule:
      name: Postavi ceo raspored
      description: Zamenjuje ceo nedeljni raspored. Dani koji nisu navedeni ostaju bez termina.
      fields:
        plans:
          name: Planovi
          description: '[{"days": "radni", "slots": [...]}, {"days": "vikend", "slots": [...]}]'
    restore_backup:
      name: Vrati raspored iz rezervne kopije
      description: Bez imena fajla vraća raspored kakav je bio pre poslednje izmene.
      fields:
        file:
          name: Fajl
          description: Ime fajla rezervne kopije iz /config/ariston_schedule_backups
    refresh:
      name: Osveži
      description: Odmah pročitaj raspored i potrošnju sa Ariston servera.
    export_xlsx:
      name: Napravi Excel izveštaj
      description: Pravi .xlsx fajl sa potrošnjom (kWh) i troškom po tarifi po mesecima, danima i satima. Link je u senzoru „Excel izveštaj“.

